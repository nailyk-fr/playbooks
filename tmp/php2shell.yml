---
- name: Check PHP version
  hosts: all
  gather_facts: false

  tasks:
    - name: Get PHP version
      ansible.builtin.command: php --version
      register: php_version
      changed_when: false
      failed_when: false

    - name: Display PHP version
      ansible.builtin.debug:
        msg: "{{ php_version.stdout_lines[0] }}"
      when: php_version.rc == 0

    - name: PHP not installed
      ansible.builtin.debug:
        msg: "PHP CLI is not installed"
      when: php_version.rc != 0

